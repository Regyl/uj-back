services:
  postgres:
    image: 'postgres:18.6'
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: 'idk_user'
      POSTGRES_PASSWORD: 'SomeUselessPassword02'
      POSTGRES_DB: 'uj'
  garage:
    image: 'dxflrs/garage:v2.3.0'
    container_name: garage
    ports:
      - '9000:3900' # S3 API
      - '3903:3903' # Admin API
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: 'idk_user'
      GARAGE_DEFAULT_SECRET_KEY: 'SomeUselessPassword02'
      GARAGE_DEFAULT_BUCKET: 'meme'
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  garage_meta:
  garage_data: